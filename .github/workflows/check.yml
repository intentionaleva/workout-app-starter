name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Animation checks
        run: node tools/check-poses.js
      - name: Config validation
        run: node tools/validate-config.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test (every routine, no console errors, offline)
        run: node tools/smoke-test.js
