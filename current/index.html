<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}body{margin:0}</style>
<title>Unser Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=DM+Sans:wght@400;500&display=swap">
<style>
/* layout: one-column phone app, one screen at a time, colour per routine */
:root{
  --bg:#F3F5F7; --card:#FFFFFF; --fg:#1B2430; --muted:#55606E; --line:#E6EAEF; --chip:#E2E7ED; --chipfg:#3A4552;
  --fig:#1B2430; --fig2:#8D97A5; --bed:#E2E7ED; --pillow:#C9D3DE; --mat:#C3CEDA; --floor:#C3CEDA; --eq:#3B4656; --eqi:#C9D3DE;
  --br-bg:#E6EEF9; --br-fg:#1D4A86; --br-dot:#2F64B3; --br-ring:#9DB7DE;
  --o-tint:#FDECE3; --o-fg:#8A3410; --o-deep:#5E230A;
  --b-tint:#E6EEF9; --b-fg:#1D4A86; --b-deep:#12345F;
  --g-tint:#E3F2EC; --g-fg:#14634B; --g-deep:#0C4434;
  --p-tint:#F1EAFB; --p-fg:#5A3A9A; --p-deep:#3B2470;
  --c-tint:#DFF2F3; --c-fg:#0E5F66; --c-deep:#083E43;
  --o-solid:#C4501F; --b-solid:#2F64B3; --g-solid:#1A7A61; --p-solid:#6B47B8; --c-solid:#157A82;
  --tint:var(--o-tint); --afg:var(--o-fg); --deep:var(--o-deep); --solid:var(--o-solid);
  --font-display:'Outfit','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --card:#1B2129; --fg:#E8ECF1; --muted:#9AA5B3; --line:#29313C; --chip:#29313C; --chipfg:#C5CDD7;
  --fig:#E8ECF1; --fig2:#6E7988; --bed:#252C36; --pillow:#38424F; --mat:#38424F; --floor:#38424F; --eq:#C5CDD7; --eqi:#29313C;
  --br-bg:#1A2638; --br-fg:#A9C4EE; --br-dot:#6E9BE0; --br-ring:#3B5478;
  --o-tint:#36231A; --o-fg:#F2A77F; --o-deep:#FBD3BE;
  --b-tint:#18263A; --b-fg:#9DBEF0; --b-deep:#CFE0FA;
  --g-tint:#14302A; --g-fg:#86D3B7; --g-deep:#C3EEDD;
  --p-tint:#28203A; --p-fg:#C4AEF0; --p-deep:#E2D6FA;
  --c-tint:#123030; --c-fg:#84D4D9; --c-deep:#C6EEF0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11151B; --card:#1B2129; --fg:#E8ECF1; --muted:#9AA5B3; --line:#29313C; --chip:#29313C; --chipfg:#C5CDD7;
  --fig:#E8ECF1; --fig2:#6E7988; --bed:#252C36; --pillow:#38424F; --mat:#38424F; --floor:#38424F; --eq:#C5CDD7; --eqi:#29313C;
  --br-bg:#1A2638; --br-fg:#A9C4EE; --br-dot:#6E9BE0; --br-ring:#3B5478;
  --o-tint:#36231A; --o-fg:#F2A77F; --o-deep:#FBD3BE;
  --b-tint:#18263A; --b-fg:#9DBEF0; --b-deep:#CFE0FA;
  --g-tint:#14302A; --g-fg:#86D3B7; --g-deep:#C3EEDD;
  --p-tint:#28203A; --p-fg:#C4AEF0; --p-deep:#E2D6FA;
  --c-tint:#123030; --c-fg:#84D4D9; --c-deep:#C6EEF0;
  color-scheme:dark;
}
.t-o{--tint:var(--o-tint);--afg:var(--o-fg);--deep:var(--o-deep);--solid:var(--o-solid)}
.t-b{--tint:var(--b-tint);--afg:var(--b-fg);--deep:var(--b-deep);--solid:var(--b-solid)}
.t-g{--tint:var(--g-tint);--afg:var(--g-fg);--deep:var(--g-deep);--solid:var(--g-solid)}
.t-p{--tint:var(--p-tint);--afg:var(--p-fg);--deep:var(--p-deep);--solid:var(--p-solid)}
.t-c{--tint:var(--c-tint);--afg:var(--c-fg);--deep:var(--c-deep);--solid:var(--c-solid)}

html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;box-sizing:border-box}
.screen{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:30px} h2{font-size:24px} h3{font-size:17px;font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--br-dot);outline-offset:2px}
.icon-btn{width:44px;height:44px;border-radius:22px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-btn svg,.ctl svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:500;padding:5px 12px;border-radius:999px;background:var(--chip);color:var(--chipfg)}
.chip.acc{background:var(--tint);color:var(--afg)}
.card{background:var(--card);border-radius:20px;padding:16px}

/* home */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:var(--tint);border-radius:24px;padding:18px;min-height:172px;text-align:left;box-sizing:border-box}
.tile.wide{grid-column:1 / -1;min-height:160px}
.tile .ico{flex-shrink:0;width:50px;height:50px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center}
.tile .ico svg{stroke:var(--solid);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .nm{font-family:var(--font-display);font-weight:600;font-size:22px;color:var(--deep)}
.tile .mt{font-size:13px;color:var(--afg)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tile .badge{font-size:12px;font-weight:500;color:var(--afg);background:var(--card);padding:4px 10px;border-radius:999px;white-space:nowrap}
.tile .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.playdot{width:46px;height:46px;border-radius:23px;background:var(--solid);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.note{font-size:13px;color:var(--muted);text-align:center}

/* overview */
.sec{display:flex;flex-direction:column;padding:14px 16px 4px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:4px}
.sec-b{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--afg)}
.ex-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.ex-row:first-of-type{border-top:0}
.thumb{width:70px;height:45px;border-radius:10px;background:var(--bg);flex-shrink:0;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.ex-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.ex-nm{font-size:15px;font-weight:500}
.ex-sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.eqc{font-size:12px;color:var(--chipfg);background:var(--chip);padding:1px 8px;border-radius:999px}
.ex-go{width:32px;height:32px;border-radius:16px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sticky{position:sticky;bottom:0;padding-block:12px calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.big-btn{width:100%;min-height:56px;border-radius:28px;background:var(--solid);color:#FFFFFF;font-family:var(--font-display);font-weight:500;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px}
.big-btn.ghost{background:var(--card);color:var(--fg)}

/* player */
.ptop{display:flex;align-items:center;gap:12px}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pinfo .l{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--solid);border-radius:3px}
.stage{background:var(--card);border-radius:24px;padding:12px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative}
.stage svg.fig{width:100%;height:auto;display:block;aspect-ratio:360/230;max-width:100%}
.view{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pill{font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;background:var(--tint);color:var(--afg)}
.pill.br{background:var(--br-bg);color:var(--br-fg);display:flex;align-items:center;gap:8px;padding-left:8px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ex-head .meta{font-size:14px;color:var(--muted)}
.count{font-family:var(--font-display);font-weight:600;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.count small{font-size:18px;color:var(--muted);font-weight:500}
.ctls{display:flex;justify-content:center;align-items:center;gap:20px}
.ctl{width:52px;height:52px;border-radius:26px;background:var(--card);display:flex;align-items:center;justify-content:center}
.ctl.main{width:68px;height:68px;border-radius:34px;background:var(--solid);color:#FFFFFF}
.cues{display:flex;flex-direction:column;gap:10px}
.cue{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.cue svg{flex-shrink:0;margin-top:2px;stroke:var(--solid);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.next{font-size:14px;color:var(--muted);text-align:center}
.next b{color:var(--fg);font-weight:500}
.overlay{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 16px}
.overlay .huge{font-family:var(--font-display);font-weight:600;font-size:72px;line-height:1;font-variant-numeric:tabular-nums;color:var(--deep)}
.overlay .lbl{font-size:14px;color:var(--afg);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sm-btn{min-height:44px;padding:0 18px;border-radius:22px;background:var(--card);font-weight:500;font-size:15px}
.sm-btn.acc{background:var(--solid);color:#FFFFFF}
.stage.tinted{background:var(--tint)}

.week{display:flex;flex-direction:column;gap:12px}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:12px;font-size:12px;color:var(--muted)}
.day.today{background:var(--bg);color:var(--fg);font-weight:500}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:19px;max-width:36px}
.dot{width:8px;height:8px;border-radius:4px;background:var(--solid);display:block}
.dot.empty{background:transparent;border:1.5px solid var(--line);box-sizing:border-box}
.goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.goal{display:flex;flex-direction:column;gap:5px;font-size:13px;min-width:0}
.goal .gl{display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
.goal b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.goal .bar{height:5px}
.lastwk{margin:0;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.wcard{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wtxt{display:flex;flex-direction:column;gap:2px;flex:1 1 180px;min-width:0}
.stepper{display:flex;align-items:center;gap:6px}
.stp{width:44px;height:44px;border-radius:22px;background:var(--bg);font-size:22px;line-height:1}
#wkg{width:58px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 18px var(--font-body);text-align:center;box-sizing:border-box}
.unit{font-size:14px;color:var(--muted)}
.typepills{display:flex;flex-wrap:wrap;gap:8px}
.tp{min-height:40px;padding:0 14px;border-radius:20px;background:var(--bg);font-size:14px;font-weight:500}
.tp[aria-pressed="true"]{background:var(--solid);color:#FFFFFF}
.entry{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:48px;border-top:1px solid var(--line);font-size:15px}
.entry:first-of-type{border-top:0}
.del{width:40px;height:40px;border-radius:20px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.del svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.bigstat{font-family:var(--font-display);font-weight:600;font-size:48px;line-height:1;color:var(--deep);font-variant-numeric:tabular-nums}
.bigstat small{font-size:22px;color:var(--afg);font-weight:500}
svg .f1{stroke:var(--fig);stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg .f2{stroke:var(--fig2);stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

</head>

<div id="app"></div>

<script>
(function(){
"use strict";
/* ---------- figure rig ---------- */
var C={TH:52,SH:50,TO:62,UA:36,FA:33,FT:14,HN:20,HR:11};
var RAD=Math.PI/180;
function D(a){return [Math.sin(a*RAD),Math.cos(a*RAD)];}
function add(p,v,l){return [p[0]+v[0]*l,p[1]+v[1]*l];}
function mid(a,b){return [(a[0]+b[0])/2,(a[1]+b[1])/2];}
function E(x){return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;}
function isObj(v){return v&&typeof v==="object"&&!Array.isArray(v);}
function M(a,b){if(!isObj(a)||!isObj(b))return b===undefined?a:b;var o={},k;for(k in a)o[k]=a[k];for(k in b)o[k]=(isObj(a[k])&&isObj(b[k]))?M(a[k],b[k]):b[k];return o;}
function lerp(a,b,k){
  if(a===undefined)return b; if(b===undefined)return a;
  if(typeof a==="number"&&typeof b==="number")return a+(b-a)*k;
  if(Array.isArray(a))return a.map(function(v,i){return lerp(v,b[i],k);});
  if(isObj(a)){var o={},keys={},x;for(x in a)keys[x]=1;for(x in b)keys[x]=1;for(x in keys)o[x]=lerp(a[x],b[x],k);return o;}
  return k<.5?a:b;
}
function ik(P,T,l1,l2,s){
  var dx=T[0]-P[0],dy=T[1]-P[1],d=Math.hypot(dx,dy),mx=l1+l2-0.5;
  if(d>mx)d=mx; if(d<1)d=1;
  var phi=Math.atan2(dy,dx),c=(l1*l1+d*d-l2*l2)/(2*l1*d);c=Math.max(-1,Math.min(1,c));
  var a=phi+s*Math.acos(c),Mi=[P[0]+l1*Math.cos(a),P[1]+l1*Math.sin(a)];
  var a2=Math.atan2(T[1]-Mi[1],T[0]-Mi[0]);
  return [Mi,[Mi[0]+l2*Math.cos(a2),Mi[1]+l2*Math.sin(a2)]];
}
function solve(p){
  var td=D(p.t),hip;
  if(p.ank){var L=p.L1,kn=add(p.ank,D(L.sh),-C.SH*(L.sl==null?1:L.sl));hip=add(kn,D(L.th),-C.TH*(L.tl==null?1:L.tl));}
  else if(p.sho){hip=add(p.sho,td,-C.TO);}
  else hip=p.hip;
  var sho=add(hip,td,C.TO),head=add(sho,D(p.h==null?p.t:p.h),C.HN);
  function leg(L){if(!L)return null;var kn,an,r;
    if(L.to){r=ik(hip,L.to,C.TH,C.SH,L.s);kn=r[0];an=r[1];}
    else{kn=add(hip,D(L.th),C.TH*(L.tl==null?1:L.tl));an=add(kn,D(L.sh),C.SH*(L.sl==null?1:L.sl));}
    return {kn:kn,an:an,ft:L.ft==null?null:add(an,D(L.ft),C.FT)};}
  function arm(A){if(!A)return null;var el,hd,r;
    if(A.to){r=ik(sho,A.to,C.UA,C.FA,A.s);el=r[0];hd=r[1];}
    else{el=add(sho,D(A.ua),C.UA);hd=add(el,D(A.fa),C.FA);}
    return {el:el,hd:hd};}
  return {hip:hip,sho:sho,head:head,L1:leg(p.L1),L2:leg(p.L2),A1:arm(p.A1),A2:arm(p.A2),tc:p.tc||0,t:p.t,g:p.g==null?0:p.g};
}
function f1(n){return n.toFixed(1);}
function pth(pts){return "M"+pts.filter(Boolean).map(function(p){return f1(p[0])+" "+f1(p[1]);}).join(" L");}

/* ---------- scenes ---------- */
var VB="0 0 360 230", VBT="-28 -36 416 266";
function sceneY(s){return s==="bed"?187:207;}
function sceneSVG(s){
  if(s==="bed")return '<rect x="14" y="192" width="332" height="26" rx="12" fill="var(--bed)"/><rect x="24" y="176" width="72" height="17" rx="8" fill="var(--pillow)"/>';
  if(s==="mat")return '<rect x="8" y="212" width="344" height="7" rx="3.5" fill="var(--mat)"/>';
  if(s==="floor")return '<rect x="-28" y="212" width="416" height="3" rx="1.5" fill="var(--floor)"/>';
  return "";
}
function wiperSVG(p){
  var w=p.w,aw=Math.abs(w);
  var k1=[172+56*w,166+6*aw],k2=[188+56*w,166-2*aw],ft1=[172+14*w,198],ft2=[188+14*w,198],h1=[171+2*w,132],h2=[189+2*w,132];
  var o='<rect x="78" y="8" width="204" height="214" rx="16" fill="var(--bed)"/><rect x="138" y="14" width="84" height="36" rx="12" fill="var(--pillow)"/>';
  o+='<circle cx="180" cy="104" r="20" fill="var(--hl)" opacity="'+(0.12+0.5*p.g).toFixed(2)+'"/>';
  o+='<path class="f2" d="'+pth([h2,k2,ft2])+'"/>';
  o+='<path class="f1" d="M146 66 L118 70 L92 72"/><path class="f1" d="M214 66 L242 70 L268 72"/>';
  o+='<path class="f1" d="M146 66 L214 66"/><path class="f1" d="M180 66 L180 130"/><path class="f1" d="'+pth([h1,h2])+'"/>';
  o+='<circle cx="180" cy="38" r="13" fill="var(--fig)"/>';
  o+='<path class="f1" d="'+pth([h1,k1,ft1])+'"/>';
  return o;
}
function figSVG(def,pose){
  if(def.custom==="wiper")return wiperSVG(pose);
  var s=solve(pose),o="";
  var hp=def.hl==="hip"?s.hip:def.hl==="sho"?s.sho:mid(s.hip,s.sho);
  o+='<circle cx="'+f1(hp[0])+'" cy="'+f1(hp[1])+'" r="17" fill="var(--hl)" opacity="'+(0.12+0.5*s.g).toFixed(2)+'"/>';
  function leg(L,c){return L?'<path class="'+c+'" d="'+pth([s.hip,L.kn,L.an,L.ft])+'"/>':"";}
  function arm(A,c){return A?'<path class="'+c+'" d="'+pth([s.sho,A.el,A.hd])+'"/>':"";}

   '<button class="big-btn" data-act="cadd">'+ICON.check.replace('<svg ','<svg style="stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round" ')+'<span>30 Minuten abhaken</span></button></div>'+
   '<div class="card" style="display:flex;flex-direction:column;gap:4px"><h3 style="padding-bottom:6px">Diese Woche</h3>'+list+'</div>'+
   '<p class="note">Letzte Woche: '+last+' '+(last===1?"Einheit":"Einheiten")+' ('+(last*30)+' Min). Zählt alles, wobei ihr etwas außer Atem kommt, aber noch sprechen könnt.</p></div>';
}
function renderOverview(rid){
  stopLoop();releaseScreen();P=null;var r=ROUT[rid];
  if(r.empty){app.innerHTML='<div class="screen '+tone(rid)+'"><button class="icon-btn" data-act="home" aria-label="Zurück zur Startseite">'+ICON.back+'</button><h1>'+esc(r.name)+'</h1><div class="card" style="display:flex;flex-direction:column;gap:8px"><h3>Hier kommen eure Übungen hin</h3><p style="margin:0;color:var(--muted);font-size:15px">Sobald die Rückbildungsübungen feststehen, bekommt diese Einheit eigene Animationen, genau wie die anderen.</p></div></div>';return;}
  var n=0,secs=r.sections.map(function(s,si){return '<div class="card sec"><div class="sec-h"><h3>'+esc(s.title)+'</h3>'+(s.badge?'<span class="sec-b">'+esc(s.badge)+'</span>':'')+'</div>'+
    s.items.map(function(it,ii){var e=EX[it[0]],sc=it[2]||e.scene;n++;return '<button class="ex-row" data-act="preview" data-r="'+rid+'" data-s="'+si+'" data-i="'+ii+'">'+
      '<span class="thumb">'+fullSVG(e,sc,thumbPose(it[0],sc),false,"",e.name)+'</span>'+
      '<span class="ex-txt"><span class="ex-nm">'+esc(e.name)+'</span><span class="ex-sub"><span>'+esc(doseText(it[1]))+'</span>'+eqChip(it[0])+'</span></span>'+
      '<span class="ex-go" style="color:var(--solid)" aria-hidden="true">'+ICON.play.replace('width="22" height="22"','width="14" height="14"')+'</span></button>';}).join("")+'</div>';}).join("");
  var chips=(r.freq?'<span class="chip acc">'+r.freq+'</span>':'')+'<span class="chip'+(r.freq?'':' acc')+'">'+r.dur+'</span><span class="chip">'+countItems(r)+' Übungen</span><span class="chip">'+esc(r.gear)+'</span>';
  app.innerHTML='<div class="screen '+tone(rid)+'"><button class="icon-btn" data-act="home" aria-label="Zurück zur Startseite">'+ICON.back+'</button>'+
   '<div style="display:flex;flex-direction:column;gap:10px"><h1>'+esc(r.name)+'</h1><div class="chips">'+chips+'</div></div>'+secs+
   '<p class="note">Tippe auf eine Übung, um sie dir vorab anzusehen.</p>'+
   (doneLabel(rid)==="Heute erledigt"?'<p class="note" style="color:var(--afg);font-weight:500">Heute erledigt</p>':'<button class="sm-btn" data-act="manual" data-r="'+rid+'" style="align-self:center">Ohne App gemacht? Heute abhaken</button>')+
   '<div class="sticky"><button class="big-btn" data-act="start" data-r="'+rid+'">'+ICON.play.replace('width="22" height="22"','width="18" height="18"')+'<span>'+(rid==="morgen"?"Routine":"Training")+' starten</span></button></div></div>';
}

function stepTarget(st){var d=st.dose;return d.secs?{kind:"t",v:d.secs}:{kind:"r",v:d.reps};}
function needsSides(st){return !!st.dose.perSide&&!EX[st.ex].alt;}
function startPlayer(rid,steps,preview,back){
  unlockAudio();lockScreen();
  P={rid:rid,steps:steps,i:0,mode:"work",side:1,t:0,paused:false,left:0,preview:!!preview,back:back||rid,lastBeep:-1};
  renderPlayer();
}
function goStep(i){P.i=i;P.mode="work";P.side=1;P.t=0;P.lastBeep=-1;renderPlayer();}
function finishStep(){
  var st=P.steps[P.i];beep(988,200);
  if(needsSides(st)&&P.side===1){P.mode="switch";P.left=4000;renderPlayer();return;}
  if(P.preview){P.side=1;P.t=0;return;}
  if(P.i>=P.steps.length-1){P.mode="done";setDone(P.rid);releaseScreen();renderPlayer();return;}
  var r=ROUT[P.rid];P.mode="rest";P.left=(st.endRound?r.roundRest:r.rest)*1000;renderPlayer();
}
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

function renderPlayer(){
  var st=P.steps[P.i],e=EX[st.ex],r=ROUT[P.rid],tn=tone(P.rid);
  var top='<div class="ptop"><button class="icon-btn" data-act="exit" aria-label="Beenden">'+ICON.close+'</button><div class="pinfo">'+
    (P.preview?'<div class="l"><span>Vorschau · '+esc(r.name)+'</span><span>'+(P.i+1)+" / "+P.steps.length+'</span></div>':
    '<div class="l"><span>'+esc(st.sec)+(st.rounds>1?" · Runde "+st.round+" von "+st.rounds:"")+'</span><span>'+(P.i+1)+" / "+P.steps.length+'</span></div><div class="bar"><i style="width:'+((P.i+(P.mode==="rest"?1:0))/P.steps.length*100).toFixed(1)+'%"></i></div>')+'</div></div>';
  if(P.mode==="done"){
    stopLoop();
    app.innerHTML='<div class="screen '+tn+'">'+'<div class="stage tinted overlay"><div class="lbl">Geschafft</div><h1 style="color:var(--deep)">'+esc(r.name)+' erledigt</h1><p style="margin:0;color:var(--afg)">'+P.steps.length+' Übungen. Stark gemacht.</p></div><button class="big-btn" data-act="home">Zur Startseite</button></div>';
    return;
  }
  if(P.mode==="rest"){
    var nx=P.steps[P.i+1],ne=EX[nx.ex];
    app.innerHTML='<div class="screen '+tn+'">'+top+'<div class="stage tinted overlay"><div class="lbl">'+(st.endRound?"Rundenpause":"Pause")+'</div><div class="huge" id="pcount">'+fmt(P.left)+'</div>'+
     '<div class="btnrow"><button class="sm-btn" data-act="plus">+15 s</button><button class="sm-btn acc" data-act="skip">Weiter</button></div></div>'+
     '<div class="card" style="display:flex;gap:14px;align-items:center"><span class="thumb" style="width:96px;height:62px">'+fullSVG(ne,nx.scene,thumbPose(nx.ex,nx.scene),false,"",ne.name)+'</span><div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span class="eyebrow">Als Nächstes'+(nx.rounds>1?" · Runde "+nx.round:"")+'</span><span class="ex-nm" style="font-size:17px">'+esc(ne.name)+'</span><span class="ex-sub">'+esc(doseText(nx.dose))+' '+eqChip(nx.ex)+'</span></div></div></div>';
    loop();return;
  }
  var nxt=!P.preview&&P.steps[P.i+1]?'<p class="next">Als Nächstes: <b>'+esc(EX[P.steps[P.i+1].ex].name)+'</b> · '+esc(doseText(P.steps[P.i+1].dose))+'</p>':"";
  app.innerHTML='<div class="screen '+tn+'">'+top+
   '<div class="stage" style="--hl:var(--solid)">'+(e.view?'<span class="view">'+e.view+'</span>':'')+'<div id="fig" style="width:100%"></div>'+
   '<div class="pills"><span class="pill" id="phase"></span><span class="pill br"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="none" stroke="var(--br-ring)" stroke-width="1"/><circle id="bdot" cx="10" cy="10" r="6" fill="var(--br-dot)"/></svg><span id="btxt"></span></span></div></div>'+
   '<div class="ex-head"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><h2>'+esc(e.name)+'</h2><span class="meta" id="meta"></span></div><div class="count" id="count"></div></div>'+
   '<div class="ctls"><button class="ctl" data-act="prev" aria-label="Vorherige Übung">'+ICON.prev+'</button><button class="ctl main" data-act="pause" id="pbtn" aria-label="Pause">'+ICON.pause+'</button><button class="ctl" data-act="skip" aria-label="Nächste Übung">'+ICON.next+'</button></div>'+
   (e.eq?'<div class="card wcard"><div class="wtxt"><h3>Gewicht</h3><span class="eyebrow">Alle Wiederholungen sauber und noch 1–2 in Reserve? Dann nächstes Mal schwerer.</span></div><div class="stepper"><button class="stp" data-act="wminus" aria-label="Gewicht verringern">−</button><input id="wkg" type="text" inputmode="decimal" autocomplete="off" aria-label="Gewicht in Kilogramm" placeholder="–" value="'+esc(getW(st.ex))+'"><span class="unit">kg</span><button class="stp" data-act="wplus" aria-label="Gewicht erhöhen">+</button></div></div>':'')+'<div class="card cues"><h3>So geht’s richtig</h3>'+e.cues.map(function(c){return '<div class="cue">'+ICON.check+'<span>'+esc(c)+'</span></div>';}).join("")+'</div>'+nxt+'</div>';
  lastTs=0;loop();
}
function updPause(){var b=document.getElementById("pbtn");if(b){b.innerHTML=P.paused?ICON.play:ICON.pause;b.setAttribute("aria-label",P.paused?"Weiter":"Pause");}}

function frame(ts){
  raf=requestAnimationFrame(frame);
  if(!P)return;var dt=lastTs?Math.min(100,ts-lastTs):0;lastTs=ts;
  var st=P.steps[P.i];
  if(P.mode==="rest"){
    if(!P.paused)P.left-=dt;var el=document.getElementById("pcount");if(el)el.textContent=fmt(P.left);
    var sec=Math.ceil(P.left/1000);if(sec<=3&&sec>0&&sec!==P.lastBeep){P.lastBeep=sec;beep(660,120);}
    if(P.left<=0){goStep(P.i+1);}
    return;
  }
  if(P.mode!=="work"&&P.mode!=="switch")return;
  var e=EX[st.ex],ai=animInfo(e),tg=stepTarget(st);
  if(P.mode==="switch"){
    if(!P.paused)P.left-=dt;
    drawFig(st,0,true,e.sideWord?"Richtung wechseln":"Seite wechseln","calm",0);
    setTxt("count",'<small>'+(e.sideWord||"Seite")+' 2 in</small> '+Math.max(0,Math.ceil(P.left/1000)));
    setTxt("meta",e.sideWord?"Gleich andersherum weiter":"Gleich geht’s mit der anderen Seite weiter");
    if(P.left<=0){P.mode="work";P.side=2;P.t=0;}
    return;
  }
  if(!P.paused)P.t+=dt;
  var a=evalAnim(st.ex,st.scene,P.t);
  drawFig(st,P.t,P.side===2,P.paused?"Pausiert":a.label,a.breath,a.k);
  var sideTxt=needsSides(st)?" · "+(e.sideWord||"Seite")+" "+P.side+" von 2":"";
  var done=false;
  if(tg.kind==="t"){var rem=tg.v*1000-P.t;setTxt("count",fmt(rem));done=rem<=0;}
  else{var per=ai.L/(e.rpc||1),rd=Math.floor(Math.max(0,P.t-ai.I)/per);setTxt("count",Math.min(rd+1,tg.v)+' <small>/ '+tg.v+'</small>');done=rd>=tg.v;}
  setTxt("meta",esc(doseText(st.dose))+(e.eq?" · "+esc(e.eq):"")+sideTxt+" · "+esc(e.target));
  if(done)finishStep();
}
var txtCache={};
function setTxt(id,h){var el=document.getElementById(id);if(el&&el._h!==h){el.innerHTML=h;el._h=h;}}
function drawFig(st,t,mirror,label,breath,k){
  var e=EX[st.ex],pose=evalAnim(st.ex,st.scene,t).pose;
  var f=document.getElementById("fig");if(f)f.innerHTML=fullSVG(e,st.scene,pose,mirror,"fig",e.name);
  setTxt("phase",esc(label));setTxt("btxt",BREATH[breath]||"");
  var r=breath==="out"?9-5*E(k):breath==="in"?4+5*E(k):breath==="hold"?6.5:6.5+2.5*Math.sin(Date.now()/700);
  var d=document.getElementById("bdot");if(d)d.setAttribute("r",r.toFixed(2));
}
function loop(){stopLoop();lastTs=0;raf=requestAnimationFrame(frame);}

/* ---------- events ---------- */
app.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;var act=b.getAttribute("data-act"),rid=b.getAttribute("data-r");
  if(act==="home")renderHome();
  else if(act==="open"){renderOverview(rid);window.scrollTo(0,0);}
  else if(act==="start"){startPlayer(rid,buildSteps(rid),false);window.scrollTo(0,0);}
  else if(act==="preview"){var all=[],pick=0,si=+b.getAttribute("data-s"),ii=+b.getAttribute("data-i");
    ROUT[rid].sections.forEach(function(sec,a){sec.items.forEach(function(it,c){if(a===si&&c===ii)pick=all.length;all.push({ex:it[0],dose:it[1],scene:it[2]||EX[it[0]].scene,sec:sec.title,round:1,rounds:1});});});
    startPlayer(rid,all,true);P.i=pick;renderPlayer();window.scrollTo(0,0);}
  else if(act==="exit"){var back=P?P.back:"morgen";renderOverview(back);window.scrollTo(0,0);}
  else if(act==="pause"){P.paused=!P.paused;updPause();}
  else if(act==="skip"){if(!P)return;if(P.mode==="rest"||P.i<P.steps.length-1){goStep(P.i+1);}else if(P.preview){goStep(0);}else{P.mode="done";setDone(P.rid);releaseScreen();renderPlayer();}}
  else if(act==="prev"){if(!P)return;if(P.mode==="rest")goStep(P.i);else goStep(Math.max(0,P.i-1));}
  else if(act==="plus"){if(P)P.left+=15000;}
  else if(act==="cardio"){renderCardio();window.scrollTo(0,0);}
  else if(act==="ctype"){setPref("ut-ctype",b.getAttribute("data-k"));renderCardio();}
  else if(act==="cadd"){addLog("cardio",{k:getPref("ut-ctype","Gehen")});renderCardio();}
  else if(act==="cdel"){var ts=+b.getAttribute("data-ts");LOG=LOG.filter(function(e){return !(e.r==="cardio"&&e.ts===ts);});saveLog();renderCardio();}
  else if(act==="manual"){addLog(rid,{manual:1});renderOverview(rid);}
  else if(act==="wminus"||act==="wplus"){if(!P)return;var id=P.steps[P.i].ex,inp=document.getElementById("wkg"),cur=parseFloat(String(inp.value).replace(",","."))||0,stp=EX[id].eq==="Kettlebell"?2:1;
    cur=Math.max(0,cur+(act==="wplus"?stp:-stp));var v=cur?String(cur).replace(".",","):"";inp.value=v;setW(id,v);}
});
app.addEventListener("change",function(ev){if(ev.target&&ev.target.id==="wkg"&&P){setW(P.steps[P.i].ex,String(ev.target.value).trim().replace(".",","));}});
renderHome();
window.__UT={EX:EX,ROUT:ROUT,solve:solve,evalAnim:evalAnim,posesFor:posesFor,buildSteps:buildSteps,animInfo:animInfo};
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script>
