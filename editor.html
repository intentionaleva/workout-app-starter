<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pose Editor</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<style>
body{background:var(--bg)}
#ed{max-width:1480px;margin:0 auto;padding:16px 20px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.bar-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bar-top h1{font-size:24px;margin-right:8px}
.bar-top .sp{flex:1}
.bar-top select{width:auto;max-width:280px}
.grid{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:1180px){.grid{grid-template-columns:minmax(0,1fr) 340px}.grid>.left{grid-column:1 / -1}}
@media (max-width:800px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{font-size:16px;font-weight:600}
.panel h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:6px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=text],input[type=number],select,textarea{font:14px var(--font-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;box-sizing:border-box;width:100%}
textarea{font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--br-dot);outline-offset:1px}
.btn{min-height:34px;padding:0 12px;border-radius:17px;background:var(--bg);font-weight:500;font-size:14px;border:1px solid var(--line);white-space:nowrap}
.btn.acc{background:var(--solid);color:#fff;border-color:transparent}
.btn.sm{min-height:28px;padding:0 9px;font-size:12px}
.btn[aria-pressed=true]{background:var(--solid);color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
.stagewrap{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
#stage{width:100%;max-height:62vh;height:auto;display:block;touch-action:none;user-select:none}
#stage .h{cursor:grab;fill:var(--solid);stroke:#fff;stroke-width:2}
#stage .h.anchor{fill:#B3261E}
#stage .h.far{fill:var(--fig2)}
#stage .h:hover{r:9}
#stage .onion{opacity:.22}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stagebar .info{flex:1;font-size:13px;color:var(--muted);min-width:160px}
.poses{display:flex;flex-wrap:wrap;gap:6px}
.sl{display:grid;grid-template-columns:62px minmax(0,1fr) 66px;gap:6px;align-items:center;font-size:12px}
.sl span{color:var(--muted)}
.sl span.own{color:var(--fg);font-weight:600}
.sl input[type=range]{width:100%;accent-color:var(--solid)}
.limb{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.limb .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.limb .hd select{width:auto}
table.tl{width:100%;border-collapse:collapse;font-size:12px}
table.tl td,table.tl th{padding:3px 3px;text-align:left;vertical-align:middle}
table.tl th{color:var(--muted);font-weight:500}
table.tl tr.on td{background:var(--tint)}
table.tl input,table.tl select{padding:4px 5px;font-size:12px}
table.tl .ms{width:70px}
.warn{font-size:13px;margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.warn li.ok{list-style:none;margin-left:-18px;color:#1A7A61}
.warn li.err{color:#B3261E}
.note2{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:14px;z-index:20}
.toast:empty{display:none}
</style>
</head>
<body class="t-orange">
<div id="ed"><p>Loading…</p></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="src/editor.js"></script>
</body>
</html>
